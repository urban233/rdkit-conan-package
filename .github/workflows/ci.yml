name: Package acceptance

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
  CTEST_PARALLEL_LEVEL: '2'

jobs:
  validation:
    name: Validate acceptance checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s ci -p 'test_*.py'

  build:
    name: Build / ${{ matrix.os }} / ${{ matrix.variant }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-14]
        variant: [static, shared, java]
        include:
          - os: ubuntu-22.04
            variant: minimal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build and test package
        run: python ci/run.py build --variant '${{ matrix.variant }}'
      - name: Upload package for independent consumption
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}-${{ matrix.variant }}
          path: |
            artifacts/packages.tgz
            artifacts/reference.txt
          if-no-files-found: error
          retention-days: 3
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ matrix.os }}-${{ matrix.variant }}
          path: |
            artifacts/*.xml
            artifacts/*.json
          if-no-files-found: warn
          retention-days: 14

  consume:
    name: Consume / ${{ matrix.os }} / ${{ matrix.variant }}
    needs: build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-14]
        variant: [static, shared, java]
        include:
          - os: ubuntu-22.04
            variant: minimal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-name: relocated-consumer-cache
      - uses: actions/download-artifact@v4
        with:
          name: package-${{ matrix.os }}-${{ matrix.variant }}
          path: artifacts
      - name: Consume package without sources, builds, or remotes
        run: python ci/run.py consume --variant '${{ matrix.variant }}'
      - name: Upload consumer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-reports-${{ matrix.os }}-${{ matrix.variant }}
          path: |
            artifacts/*.xml
            artifacts/*.json
          if-no-files-found: warn
          retention-days: 14

  ci-required:
    name: ci-required
    if: always()
    needs: [validation, build, consume]
    runs-on: ubuntu-22.04
    steps:
      - name: Require every package and consumer job to pass
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CONSUME_RESULT: ${{ needs.consume.result }}
        run: |
          test "$VALIDATION_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$CONSUME_RESULT" = success
