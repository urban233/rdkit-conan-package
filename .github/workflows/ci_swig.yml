name: CI SWIG

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Conan and build tools
        run: |
          pip install --upgrade conan
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' --yes
          choco install ninja --yes

      - name: Set Conan home
        run: echo "CONAN_USER_HOME=${{ runner.temp }}\conan" >> $env:GITHUB_ENV

      - name: Create Conan default profile
        run: conan profile detect --force

      - name: Get the sources from GitHub
        run: conan source

      - name: Conan install
        run: conan install . --build=missing --profile profiles/windows/release_java

      - name: Build package
        run: conan build . --profile profiles/windows/release_java

  build-macos:
    name: Build on macOS
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Conan and build tools
        run: |
          pip install --upgrade conan
          brew install cmake ninja

      - name: Set Conan home
        run: echo "CONAN_USER_HOME=${{ runner.temp }}/conan" >> $GITHUB_ENV

      - name: Create Conan default profile
        run: conan profile detect --force

      - name: Get the sources from GitHub
        run: conan source

      - name: Conan install
        run: conan install . --build=missing --profile profiles/macos/release_java

      - name: Build package
        run: conan build . --profile profiles/macos/release_java

  build-linux:
    name: Build on Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libx11-dev libx11-xcb-dev libfontenc-dev libice-dev libsm-dev \
            libxau-dev libxaw7-dev libxcomposite-dev libxcursor-dev \
            libxdamage-dev libxfixes-dev libxi-dev libxinerama-dev \
            libxmu-dev libxmuu-dev libxpm-dev libxrandr-dev libxres-dev \
            libxss-dev libxtst-dev libxv-dev libxxf86vm-dev libxcb-glx0-dev \
            libxcb-render-util0-dev libxcb-xkb-dev libxcb-icccm4-dev \
            libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev \
            libxcb-shape0-dev libxcb-sync-dev libxcb-xfixes0-dev \
            libxcb-xinerama0-dev libxcb-dri3-dev libxcb-cursor-dev \
            libxcb-dri2-0-dev libxcb-present-dev libxcb-composite0-dev \
            libxcb-ewmh-dev libxcb-res0-dev

      - name: Install Conan
        run: pip install --upgrade conan

      - name: Set Conan home
        run: echo "CONAN_USER_HOME=${{ runner.temp }}/conan" >> $GITHUB_ENV

      - name: Create Conan default profile
        run: conan profile detect --force

      - name: Get the sources from GitHub
        run: conan source

      - name: Conan install
        run: |
          conan install . --build=missing --profile profiles/linux/release_java \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True

      - name: Build package
        run: conan build . --profile profiles/linux/release_java
